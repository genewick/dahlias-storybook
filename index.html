<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff4fa3">
<title>Dahlia's Pink-Tastic Week!</title>
<style>
:root{--pink:#ff4fa3;--hot:#e90070;--pale:#fff0f8;--ink:#3b1730;--sun:#ffd95a;--mint:#a9f3df;--sky:#a9e8ff;--white:#fff;--shadow:0 16px 45px #a9005528}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Trebuchet MS",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#fff 0 3%,transparent 3.2%),linear-gradient(135deg,#ffd3e8,#fff7c9 48%,#c9f6ff)}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#fffdf8e8;border-bottom:3px solid #ff9acb;position:sticky;top:0;z-index:20}.brand{font-weight:900;color:#b90059}.school-line{font-size:.92rem;font-weight:700;text-align:center;flex:1}.icon-btn{border:2px solid var(--ink);background:#fff;border-radius:14px;padding:8px 12px;font-weight:800}.stage{flex:1;display:grid;place-items:center;padding:18px}.book{width:min(1040px,96vw);min-height:min(690px,75vh);background:#fff;border:5px solid #fff;border-radius:30px;box-shadow:var(--shadow);overflow:hidden;position:relative}.page{display:none;min-height:min(680px,74vh);grid-template-columns:1fr 1fr;align-items:stretch}.page.active{display:grid}.copy{padding:clamp(26px,5vw,64px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,#fff,#fff9fc)}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-weight:900;color:var(--hot);font-size:.8rem}.copy h1,.copy h2{margin:.25em 0;color:#b90059;line-height:1.02}.copy h1{font-size:clamp(2.8rem,7vw,5.7rem)}.copy h2{font-size:clamp(2.1rem,5vw,4.1rem)}.story{font-size:clamp(1.55rem,3vw,2.45rem);line-height:1.28;font-weight:800;margin:.45em 0}.tiny{font-size:1rem;font-weight:700}.art{position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#ff77b9,#ffcbe3 45%,#fff1a6)}.art svg{width:88%;height:88%;filter:drop-shadow(0 12px 10px #9d245033)}.sparkles:before,.sparkles:after{content:"✦  ✧  ★  ✦  ✧";position:absolute;color:#fff;font-size:clamp(1.2rem,3vw,2.2rem);letter-spacing:12px;transform:rotate(-12deg);top:7%;left:8%;text-shadow:0 2px 0 #d12a78}.sparkles:after{top:auto;left:auto;right:7%;bottom:7%;transform:rotate(10deg)}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:12px 14px 18px}.control{border:3px solid var(--ink);border-radius:16px;padding:12px 18px;background:#fff;font-weight:900;box-shadow:0 4px 0 var(--ink);min-width:145px}.control.primary{background:var(--pink);color:#fff}.control:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.control:disabled{opacity:.4;cursor:not-allowed}.counter{text-align:center;font-weight:900;color:#8d285b;padding:2px}.dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:0 12px 6px}.dot{width:9px;height:9px;border-radius:50%;background:#e8b3cd}.dot.on{background:#b90059;transform:scale(1.3)}dialog{border:4px solid var(--pink);border-radius:22px;padding:0;box-shadow:var(--shadow);width:min(440px,90vw)}dialog::backdrop{background:#43132b99}.settings{padding:24px}.settings h2{margin-top:0;color:#b90059}.settings label{display:block;font-weight:900;margin:14px 0 5px}.settings input{width:100%;padding:12px;border:2px solid #9e4c75;border-radius:12px}.settings-actions{display:flex;gap:10px;margin-top:18px}.settings-actions button{flex:1}.cover .copy{text-align:center;background:linear-gradient(160deg,#fff,#ffe1f0)}.cover .art{background:linear-gradient(145deg,#ff4fa3,#ff98ca 48%,#ffe970)}.ribbon{display:inline-block;background:#ffde59;padding:7px 14px;border-radius:999px;font-weight:900;transform:rotate(-2deg)}.footer-note{text-align:center;font-size:.85rem;font-weight:700;padding-bottom:10px;color:#763a59}@media(max-width:720px){.page.active{grid-template-columns:1fr;grid-template-rows:auto 44vh}.copy{padding:28px 26px}.book{min-height:0}.page{min-height:0}.topbar{align-items:flex-start}.school-line{font-size:.78rem}.control{min-width:0;flex:1 1 42%;padding:11px 8px}.story{font-size:clamp(1.4rem,6vw,2rem)}}
@media print{@page{size:letter landscape;margin:.3in}body{background:#fff}.topbar,.controls,.dots,.counter,.footer-note,dialog{display:none!important}.stage{display:block;padding:0}.book{width:auto;min-height:0;border:0;box-shadow:none;border-radius:0;overflow:visible}.page,.page.active{display:grid!important;grid-template-columns:1fr 1fr;width:10.4in;height:7.85in;break-after:page;page-break-after:always;border:1px solid #ddd;overflow:hidden}.copy{padding:.55in}.art svg{width:82%;height:82%}.copy h1{font-size:42pt}.copy h2{font-size:31pt}.story{font-size:22pt}.eyebrow{font-size:10pt}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand">Dahlia's Pink-Tastic Week!</div><div class="school-line"><span id="schoolHead">My School</span> • <span id="teacherHead">My Teacher</span></div><button class="icon-btn" id="settingsBtn" aria-label="Open book settings">Book Settings</button></header>
<main class="stage"><section class="book" id="book" aria-live="polite"></section></main>
<div class="counter" id="counter"></div><div class="dots" id="dots" aria-hidden="true"></div>
<nav class="controls" aria-label="Story controls"><button class="control" id="prev">Previous Page</button><button class="control primary" id="read">Read Aloud</button><button class="control" id="next">Next Page</button><button class="control" id="print">Print Booklet</button></nav>
<div class="footer-note">Use the Left and Right Arrow keys to turn pages.</div>
</div>
<dialog id="settings"><form class="settings" method="dialog"><h2>Make It Dahlia's</h2><label for="teacher">Teacher's name</label><input id="teacher" maxlength="60" placeholder="Ms. Teacher"><label for="school">School name</label><input id="school" maxlength="80" placeholder="Dahlia's School"><div class="settings-actions"><button class="control" value="cancel">Cancel</button><button class="control primary" id="saveSettings" value="default">Save</button></div></form></dialog>
<script>
const icon=(kind)=>{const common=`viewBox="0 0 420 420" role="img" aria-label="${kind} illustration"`;const girl=`<circle cx="210" cy="150" r="72" fill="#8b542f"/><circle cx="210" cy="156" r="62" fill="#f3b38d"/><path d="M145 142q18-88 70-70t62 72q-32-20-65-48-29 35-67 46" fill="#4b2c20"/><circle cx="190" cy="155" r="5"/><circle cx="232" cy="155" r="5"/><path d="M192 180q20 16 40 0" fill="none" stroke="#b43b68" stroke-width="6" stroke-linecap="round"/>`;let body='';if(kind==='cover'||kind==='pink'||kind==='friend')body=`${girl}<path d="M140 235q70-45 140 0l35 125H105z" fill="#ff3f9d"/><path d="M115 300h190" stroke="#ffd5ea" stroke-width="18"/><circle cx="110" cy="75" r="28" fill="#ffde59"/><path d="M85 76h50M110 50v50" stroke="#fff" stroke-width="8"/>`;if(kind==='fire')body=`${girl}<path d="M145 115q65-75 130 0z" fill="#ff4fa3"/><rect x="173" y="78" width="74" height="22" rx="10" fill="#fff"/><path d="M145 235q65-35 130 0l25 130H120z" fill="#ff5c74"/><path d="M300 300q65-45 90-10" fill="none" stroke="#57c9ff" stroke-width="18" stroke-linecap="round"/><circle cx="345" cy="230" r="34" fill="#fff"/><path d="M320 218q25-30 50 0" fill="#aaa"/><circle cx="335" cy="233" r="4"/><circle cx="355" cy="233" r="4"/>`;if(kind==='dance')body=`${girl}<path d="M150 230q60-40 120 0l100 130H50z" fill="#ff2f92"/><path d="M80 315q130-55 260 0M105 345q105-45 210 0" fill="none" stroke="#ffd94f" stroke-width="15"/><path d="M170 225l-65-65M250 225l65-65" stroke="#f3b38d" stroke-width="20" stroke-linecap="round"/>`;if(kind==='swim')body=`${girl}<path d="M150 230q60-35 120 0l-25 70 75 45q-70 40-140 0l-25-45z" fill="#ff4fa3"/><path d="M0 315q55-35 110 0t110 0 110 0 110 0v105H0z" fill="#6edcff"/><path d="M270 285q70 15 100 65-65 15-110-20" fill="#b5f4e5"/>`;if(kind==='art')body=`${girl}<path d="M145 235q65-35 130 0l30 125H115z" fill="#ffd45e"/><rect x="280" y="180" width="105" height="140" rx="8" fill="#fff" stroke="#6b3b55" stroke-width="8"/><circle cx="330" cy="225" r="22" fill="#ff4fa3"/><path d="M305 275l25-30 30 45" fill="none" stroke="#5cc5f1" stroke-width="12"/>`;if(kind==='dress')body=`${girl}<path d="M145 235q65-35 130 0l25 125H120z" fill="#9d63ff"/><path d="M170 90l40-42 40 42-18-5-22 25-22-25z" fill="#ffdc55"/><path d="M120 260l-70-40M300 260l70-40" stroke="#f3b38d" stroke-width="18" stroke-linecap="round"/><path d="M45 180l25 25-25 25-25-25zM350 180l25 25-25 25-25-25z" fill="#ff4fa3"/>`;if(kind==='family')body=`${girl}<circle cx="90" cy="185" r="48" fill="#c6865f"/><circle cx="330" cy="185" r="48" fill="#d59a76"/><circle cx="90" cy="178" r="42" fill="#f1b18d"/><circle cx="330" cy="178" r="42" fill="#f0b995"/><path d="M40 300q50-70 100 0v70H40z" fill="#6ac7ff"/><path d="M280 300q50-70 100 0v70H280z" fill="#ff9c45"/><path d="M145 235q65-35 130 0l25 130H120z" fill="#ff4fa3"/>`;if(kind==='star')body=`${girl}<path d="M145 235q65-35 130 0l30 125H115z" fill="#ff4fa3"/><path d="M330 65l18 38 42 5-31 29 8 42-37-20-37 20 8-42-31-29 42-5z" fill="#ffdd58"/>`;return `<svg ${common}>${body}</svg>`}
const pages=[
{cover:1,k:'cover',title:"Dahlia's Pink-Tastic Week!",text:'A Student of the Week story starring Dahlia.',tag:'A little book about a big, bright kid'},
{k:'pink',title:'Pink Is Powerful',text:'Dahlia loves pink. Pink can sparkle. Pink can shine!',tag:'Page 1'},
{k:'friend',title:'Meet Pippa Pink',text:'Pippa loves pink, too. She is cheerful, kind, and ready to play!',tag:'Page 2'},
{k:'pink',title:'Monday: Pink Day',text:'Dahlia picks a pink ribbon. Pippa picks two. They giggle.',tag:'Page 3'},
{k:'fire',title:'A Big Dream',text:'Dahlia wants to be a firefighter. She is brave. She helps!',tag:'Page 4'},
{k:'fire',title:'The Pink Helmet',text:'Her helmet is pink. Her boots are strong. Dahlia is ready!',tag:'Page 5'},
{k:'fire',title:'Kitten Rescue',text:'Meow! A kitten needs help. Dahlia climbs up and brings it down.',tag:'Page 6'},
{k:'fire',title:'Splash!',text:'Dahlia sprays the water. Whoosh! The pretend fire is out.',tag:'Page 7'},
{k:'dance',title:'Tuesday: Twirl Day',text:'Dahlia swirls her bright Ballet Folklórico dress. Swish, swish, swirl!',tag:'Page 8'},
{k:'dance',title:'Dance With Joy',text:'Her skirt makes a rainbow. Her feet tap. Dahlia smiles.',tag:'Page 9'},
{k:'swim',title:'Wednesday: Swim Day',text:'Dahlia jumps in. Splash! She swims like a mermaid.',tag:'Page 10'},
{k:'swim',title:'Mermaid Magic',text:'Kick, glide, float. Dahlia is strong in the water.',tag:'Page 11'},
{k:'art',title:'Thursday: Art Day',text:'Dahlia draws. She colors. Pink stars fill her page.',tag:'Page 12'},
{k:'art',title:'Make Something New',text:'A crayon can make a sun. A marker can make a dream.',tag:'Page 13'},
{k:'dress',title:'Dress-Up Time',text:'Crown on. Cape on. Dahlia can be a queen and a superhero!',tag:'Page 14'},
{k:'dress',title:'Super Dahlia',text:'She zooms to help Pippa. Kindness is her superpower.',tag:'Page 15'},
{k:'family',title:'Friday: Family Day',text:'Dahlia loves family time. Hugs, laughs, games, and stories feel good.',tag:'Page 16'},
{k:'family',title:'Siblings Are Fun',text:'They play. They share. They make silly faces together.',tag:'Page 17'},
{k:'friend',title:'A Pink-Tastic Friend',text:'Pippa cheers for Dahlia. Dahlia cheers for Pippa. Friends lift us up.',tag:'Page 18'},
{k:'star',title:'Student of the Week',text:'Dahlia is curious. Dahlia is creative. Dahlia is kind.',tag:'Page 19'},
{k:'star',title:'Shine, Dahlia, Shine!',text:'Dream big. Help others. Be you. Your week is pink-tastic!',tag:'Page 20'}];
const book=document.querySelector('#book'),dots=document.querySelector('#dots'),counter=document.querySelector('#counter');let current=0;
function render(){book.innerHTML=pages.map((p,i)=>`<article class="page ${i===current?'active':''} ${p.cover?'cover':''}" data-page="${i}" aria-hidden="${i!==current}"><div class="copy"><div class="eyebrow">${p.tag}</div><${p.cover?'h1':'h2'}>${p.title}</${p.cover?'h1':'h2'}><p class="story">${p.text}</p>${p.cover?'<p><span class="ribbon">Made especially for Dahlia</span></p>':''}</div><div class="art sparkles">${icon(p.k)}</div></article>`).join('');dots.innerHTML=pages.map((_,i)=>`<span class="dot ${i===current?'on':''}"></span>`).join('');counter.textContent=current===0?'Cover':`Page ${current} of 20`;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===pages.length-1;}
function go(n){speechSynthesis.cancel();current=Math.max(0,Math.min(pages.length-1,n));render();book.focus?.()}
document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);document.querySelector('#print').onclick=()=>{speechSynthesis.cancel();window.print()};document.querySelector('#read').onclick=()=>{speechSynthesis.cancel();const p=pages[current];const u=new SpeechSynthesisUtterance(`${p.title}. ${p.text}`);u.rate=.88;u.pitch=1.08;u.volume=1;speechSynthesis.speak(u)};
addEventListener('keydown',e=>{if(document.querySelector('#settings').open)return;if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});
const dialog=document.querySelector('#settings'),teacher=document.querySelector('#teacher'),school=document.querySelector('#school');function loadSettings(){teacher.value=localStorage.getItem('dahliaTeacher')||'';school.value=localStorage.getItem('dahliaSchool')||'';document.querySelector('#teacherHead').textContent=teacher.value||'My Teacher';document.querySelector('#schoolHead').textContent=school.value||'My School'}document.querySelector('#settingsBtn').onclick=()=>dialog.showModal();document.querySelector('#saveSettings').onclick=()=>{localStorage.setItem('dahliaTeacher',teacher.value.trim());localStorage.setItem('dahliaSchool',school.value.trim());setTimeout(loadSettings)};loadSettings();render();
</script>
</body>
</html>
